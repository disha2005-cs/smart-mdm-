name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mdm
          POSTGRES_PASSWORD: mdm
          POSTGRES_DB: mdm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdm -d mdm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://mdm:mdm@localhost:5432/mdm_test
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-real-32plus
      SEED_ADMIN_PASSWORD: ci-admin-password-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every source file
        working-directory: backend
        run: python -m compileall -q app main.py seed.py

      - name: Import the app and count its routes
        working-directory: backend
        run: |
          python - <<'PY'
          import main
          paths = main.app.openapi()["paths"]
          print(f"{len(paths)} API paths registered")
          assert len(paths) > 50, "routes are missing"
          PY

      - name: Create the schema on an empty database
        working-directory: backend
        run: |
          python - <<'PY'
          from app.db_bootstrap import sync_schema
          from app.database import engine
          from sqlalchemy import inspect
          sync_schema()
          tables = sorted(inspect(engine).get_table_names())
          print(f"{len(tables)} tables: {', '.join(tables)}")
          for required in ("users", "schools", "students", "attendances",
                           "inventory", "daily_meals", "budgets",
                           "food_allocations", "alerts", "face_encodings"):
              assert required in tables, f"missing table: {required}"
          PY

      - name: Seed the first administrator (and confirm it is idempotent)
        working-directory: backend
        run: |
          python seed.py
          python seed.py

      - name: Verify the meal calculator against the PM POSHAN norms
        working-directory: backend
        run: |
          python - <<'PY'
          from app.services.meal_calculator import (
              classify_student_by_grade, calculate_cost_estimate, match_inventory_item,
          )

          # Grade parsing, including the formats the UI can produce.
          cases = {"1": "PRIMARY", "5": "PRIMARY", "V": "PRIMARY", "5th": "PRIMARY",
                   "Grade 3": "PRIMARY", "6": "UPPER_PRIMARY", "VIII": "UPPER_PRIMARY",
                   "9": "SECONDARY", "10": "SECONDARY", None: "PRIMARY", "": "PRIMARY"}
          for grade, expected in cases.items():
              actual = classify_student_by_grade(grade)
              assert actual == expected, f"{grade!r} -> {actual}, expected {expected}"

          # Costing: quantity x unit price, with unpriced items reported.
          plan = {"total_students": 2,
                  "requirements": {"rice_kg": 0.2, "wheat_kg": 0.0, "dal_kg": 0.04,
                                   "vegetables_kg": 0.1, "oil_liters": 0.01}}
          cost = calculate_cost_estimate(plan, {"rice": 40.0, "dal": 120.0})
          assert cost["total_cost"] == 12.8, cost["total_cost"]      # 0.2*40 + 0.04*120
          assert cost["per_student_cost"] == 6.4, cost["per_student_cost"]
          assert set(cost["missing_prices"]) == {"vegetables", "oil"}
          assert cost["is_complete"] is False

          # Inventory name matching, including the order-sensitive cases.
          for name, expected in [("Basmati Rice", "rice"), ("Wheat Flour", "wheat"),
                                 ("Atta", "wheat"), ("Toor Dal", "dal"),
                                 ("Mustard Oil", "oil"), ("Potatoes", "vegetables"),
                                 ("Salt", None)]:
              assert match_inventory_item(name) == expected, name

          print("meal calculator checks passed")
          PY

      - name: Reject a weak JWT secret
        working-directory: backend
        run: |
          python - <<'PY'
          import os, subprocess, sys
          env = {**os.environ, "JWT_SECRET_KEY": "short"}
          result = subprocess.run([sys.executable, "-c", "import app.core.config"],
                                  env=env, capture_output=True, text=True)
          assert result.returncode != 0, "a 5-character secret was accepted"
          print("weak secret correctly rejected at startup")
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        working-directory: frontend-new
        run: npm ci

      - name: Lint
        working-directory: frontend-new
        run: npm run lint

      - name: Type-check and build
        working-directory: frontend-new
        env:
          # Same value the Docker image builds with.
          VITE_API_URL: /api/v1
        run: npm run build

      - name: Confirm the bundle is same-origin
        working-directory: frontend-new
        run: |
          if grep -rq "localhost:8000" dist/assets/*.js; then
            echo "::error::a localhost API URL leaked into the production bundle"
            exit 1
          fi
          echo "no hardcoded API host in the bundle"

  docker:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only worth the build time once the code itself is known good.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Write a CI .env
        run: |
          cp .env.example .env
          python -c "import secrets; print('JWT_SECRET_KEY=' + secrets.token_urlsafe(48))" >> .env
          echo "SEED_ADMIN_PASSWORD=ci-admin-password-1" >> .env

      - name: Build and start the whole stack
        run: docker compose up -d --build --wait --wait-timeout 900

      - name: Backend health
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
               --retry-all-errors http://localhost:8000/health

      - name: Frontend serves the app
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
               --retry-all-errors http://localhost:8080/ | grep -q "<div id=\"root\">"
          echo "SPA served"

      - name: API reachable through the nginx proxy
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/v1/health

      - name: Deep links fall through to the SPA
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/dashboard)
          test "$code" = "200" || { echo "::error::deep link returned $code"; exit 1; }

      - name: Login works end to end
        run: |
          token=$(curl --fail --silent -X POST http://localhost:8080/api/v1/auth/login \
                    -H 'Content-Type: application/json' \
                    -d '{"employee_id":"GOV-001","password":"ci-admin-password-1","role":"GOVERNMENT"}' \
                  | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          test -n "$token"
          curl --fail --silent http://localhost:8080/api/v1/dashboard/government \
               -H "Authorization: Bearer $token" > /dev/null
          echo "authenticated request through the proxy succeeded"

      - name: Unauthenticated requests are rejected
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/dashboard/government)
          test "$code" = "401" || { echo "::error::expected 401, got $code"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
