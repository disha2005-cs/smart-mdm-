# Smart Mid-Day Meal Management System
#
#   cp .env.example .env     # set DATABASE_URL and JWT_SECRET_KEY
#   docker compose up --build
#
# Open http://localhost:8080 once the frontend reports healthy.
#
# The app connects to whatever DATABASE_URL points at - a managed Postgres
# (Neon, RDS, Supabase) is the default path. If you have no database of your
# own, start the bundled one instead:
#
#   docker compose --profile localdb up --build
#
# ...and set DATABASE_URL to the value shown in .env.example for that profile.

name: smart-mdm

services:
  # ---------------------------------------------------------------- backend --
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Required. Any Postgres: managed, or the bundled `db` service below.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env - see .env.example}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env - see .env.example}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}

      # Optional S3 photo storage. Left blank, photos go to the uploads volume
      # and are served by the backend.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}

      # Extra browser origins allowed to call the API directly. Not needed for
      # the bundled frontend, which nginx serves from the same origin.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}

      # Warm the face model at boot so the first capture is not a cold start.
      PRELOAD_FACE_MODEL: ${PRELOAD_FACE_MODEL:-true}

      SEED_ADMIN_EMPLOYEE_ID: ${SEED_ADMIN_EMPLOYEE_ID:-GOV-001}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@pmposhan.gov.in}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
    volumes:
      - uploads:/app/uploads
      # Survives rebuilds, and catches the model if the build-time download
      # was skipped.
      - insightface_models:/opt/insightface
    # Wait for the database (a serverless one may be asleep), create anything
    # missing in the schema, add the first administrator if there is none,
    # then serve. Both of the first two steps are no-ops once they have run.
    command: >
      sh -c "python -c 'from app.db_bootstrap import sync_schema; sync_schema()' &&
             python seed.py &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"
    ports:
      # Published for /docs and direct API calls; the UI does not need it.
      - "${BACKEND_PORT:-8000}:8000"

  # --------------------------------------------------------------- frontend --
  frontend:
    build:
      context: ./frontend-new
      args:
        # Relative, so the browser calls whatever origin served the page and
        # nginx proxies through to the backend.
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        # Healthy, not merely started: nginx proxying to a backend that is not
        # yet accepting connections just serves 502s.
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # --------------------------------------------------------------- database --
  # Only started with `--profile localdb`. Skipped entirely when DATABASE_URL
  # points at a managed Postgres, which is the default.
  db:
    profiles: ["localdb"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mdm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdm_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-mdm}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdm} -d ${POSTGRES_DB:-mdm}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      # Published so you can inspect it with a local client.
      - "${POSTGRES_PORT:-5432}:5432"

volumes:
  db_data:
  uploads:
  insightface_models:
